<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HER NextGen - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .table-dark { background-color: #1e293b; color: #fff; }
    </style>
</head>
<body class="p-4">

    <div class="container" id="admin-login-box">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="admin-card mt-5">
                    <h4 class="text-center mb-4 text-emerald" style="color: #10b981;"><i class="fa-solid fa-lock me-2"></i>অ্যাডমিন লগইন</h4>
                    <form onsubmit="handleAdminLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">পাসওয়ার্ড</label>
                            <input type="password" id="admin-pass" class="form-control bg-dark text-white border-secondary" placeholder="অ্যাডমিন পাসওয়ার্ড দিন" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">লগইন</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container d-none" id="admin-dashboard">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-gauge text-success me-2"></i>অ্যাডমিন কন্ট্রোল প্যানেল</h2>
            <button class="btn btn-outline-danger btn-sm" onclick="location.reload()">লগআউট</button>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="admin-card text-center">
                    <small class="text-muted">মোট রেজিস্টার্ড ইউজার</small>
                    <h3 class="text-info mt-2" id="total-users">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card text-center">
                    <small class="text-muted">পেন্ডিং রিচার্জ রিকোয়েস্ট</small>
                    <h3 class="text-warning mt-2" id="total-recharges">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card text-center">
                    <small class="text-muted">মোট উইথড্র রিকোয়েস্ট</small>
                    <h3 class="text-danger mt-2" id="total-withdraws">0</h3>
                </div>
            </div>
        </div>

        <div class="admin-card mt-4">
            <h5><i class="fa-solid fa-wallet text-warning me-2"></i>ইউজার রিচার্জ রিকোয়েস্ট লিস্ট</h5>
            <div class="table-responsive mt-3">
                <table class="table table-dark table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ইউজার</th>
                            <th>পরিমাণ (USDT)</th>
                            <th>TxID</th>
                            <th>স্ট্যাটাস</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="recharge-table-body">
                        <tr>
                            <td colspan="5" class="text-center text-muted">কোনো নতুন রিচার্জ রিকোয়েস্ট নেই</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') {
                document.getElementById('admin-login-box').classList.add('d-none');
                document.getElementById('admin-dashboard').classList.remove('d-none');
                loadAdminData();
            } else {
                alert('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন (admin123)');
            }
        }

        function loadAdminData() {
            document.getElementById('total-users').innerText = '5';
            document.getElementById('total-recharges').innerText = '2';
            document.getElementById('total-withdraws').innerText = '1';

            const tbody = document.getElementById('recharge-table-body');
            tbody.innerHTML = `
                <tr>
                    <td>01712345678</td>
                    <td>$50 USDT</td>
                    <td>0x8f9c...31a2</td>
                    <td><span class="badge bg-warning">Pending</span></td>
                    <td>
                        <button class="btn btn-sm btn-success me-1" onclick="alert('রিচার্জ এপ্রুভ করা হয়েছে!')">Approve</button>
                        <button class="btn btn-sm btn-danger" onclick="alert('রিচার্জ রিজেক্ট করা হয়েছে!')">Reject</button>
                    </td>
                </tr>
            `;
        }
    </script>
</body>
</html>
